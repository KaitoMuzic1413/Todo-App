name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage
            os: ubuntu-22.04
            bundle: appimage
            artifact: linux-appimage
            file: frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            updater_file: frontend/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz*
          - name: Windows installer
            os: windows-latest
            bundle: nsis
            artifact: windows-installer
            file: frontend/src-tauri/target/release/bundle/nsis/*.exe
            updater_file: frontend/src-tauri/target/release/bundle/nsis/*.nsis.zip*
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev
      - run: npm ci
      - name: Build desktop bundle
        run: npx tauri build --bundles ${{ matrix.bundle }}
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.file }}
            ${{ matrix.updater_file }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach installers to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create updater manifest
        run: python .github/scripts/create-updater-manifest.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
