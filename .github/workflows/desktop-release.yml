name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage and deb
            os: ubuntu-22.04
            platform: linux
            bundles: appimage,deb
            artifact: linux-x64
            files: |
              frontend/src-tauri/target/release/bundle/appimage/*.AppImage
              frontend/src-tauri/target/release/bundle/deb/*.deb
              frontend/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz*
          - name: Windows installer
            os: windows-latest
            platform: windows
            bundles: nsis
            artifact: windows-x64
            files: |
              frontend/src-tauri/target/release/bundle/nsis/*.exe
              frontend/src-tauri/target/release/bundle/nsis/*.nsis.zip*
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node ../.github/scripts/verify-desktop-version.mjs
      - name: Check updater signing key
        run: node ../.github/scripts/verify-desktop-signing-key.mjs
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev
      - run: npm ci
      - name: Build desktop bundle
        run: node node_modules/@tauri-apps/cli/tauri.js build --bundles ${{ matrix.bundles }}
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GITHUB_REPOSITORY: ${{ vars.VITE_GITHUB_REPOSITORY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Validate packaged files
        run: node ../.github/scripts/verify-desktop-artifacts.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach installers to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create updater manifest
        run: python .github/scripts/create-updater-manifest.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
