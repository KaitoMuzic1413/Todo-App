services:
  - type: web
    name: todo-backend
    env: node
    plan: free
    buildCommand: "cd backend && npm ci"
    startCommand: "cd backend && npm start"
    envVars:
      - key: PORT
        value: "5001"
      - key: NODE_ENV
        value: "production"
  - type: static
    name: todo-frontend
    env: static
    plan: free
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: "frontend/dist"
